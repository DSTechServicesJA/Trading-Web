
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deriv V75 (1-S) IT Guru Trading Bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">

  <!-- HEADER -->
  <h1>IT Guru – V75 1(s) Bot</h1>

  <!-- GRID WRAPPER -->
  <div class="layout-grid">

    <!-- ================= LEFT PANEL ================= -->
    <div class="left-panel">

      <!-- Account type toggle -->
      <section class="account-toggle" aria-labelledby="acct-label">
        <label id="acct-label">
          <input type="checkbox" id="liveToggle" />
          <span>Live Account (Real Money)</span>
        </label>
        <p class="hint">Toggle off to use Demo; ON for Real.</p>
      </section>

      <!-- OAuth Login -->
      <section class="oauth-box">
        <button id="oauthLogin" type="button">Login with Deriv</button>
        <button id="logoutBtn" type="button" style="display:none;">Logout</button>
      </section>

      <!-- Manual Token -->
      <section class="box">
        <label for="token">Deriv API Token (optional)</label>
        <input type="password" id="token" placeholder="Enter Deriv API Token" />
        <p class="hint">Use only if OAuth is not available.</p>
        <button id="connectBtn" type="button">Connect</button>
      </section>

      <!-- Signal Mode -->
      <div class="signal-select">
        <label for="signalMode">Signal Mode</label>
        <select id="signalMode">
          <option value="ODD_EVEN">Odd / Even Bias</option>
          <option value="REVERSAL">Last Digit Reversal</option>
          <option value="TREND">Last Digit Trend</option>
          <option value="RANDOM">Random (Test)</option>
        </select>
      </div>

      <!-- Risk Controls -->
      <section class="risk">
        <label for="takeProfit">Take Profit ($)</label>
        <input type="number" id="takeProfit" placeholder="e.g. 10" />

        <label for="stopLoss">Stop Loss ($)</label>
        <input type="number" id="stopLoss" placeholder="e.g. 10" />

        <button id="resetSession" type="button">Reset Session</button>
      </section>

      <!-- Connection Info -->
      <section class="info">
        <p><strong>Balance:</strong> <span id="balance">---</span></p>

        <div class="live-price">
          <span class="label">Live Price</span>
          <span id="livePrice" class="price">--</span>
        </div>

        <p><strong>Status:</strong> <span id="status">Disconnected</span></p>
        <p class="env-label" id="environmentLabel">Environment: DEMO</p>
      </section>

      <!-- Controls -->
      <section class="controls">
        <button id="startBtn" disabled>Start Bot</button>
        <button id="stopBtn" disabled>Stop Bot</button>
      </section>

    </div>

<!-- ================= RIGHT PANEL ================= -->


       <div class="right-panel">
        
              <!-- Live Chart -->
              <section class="chart-embed">
                <canvas id="priceChart" width="600" height="auto"></canvas>
              </section>
              

              <h3 class="">Performance</h3>
                       <section class="dashboard">
                          <div><strong>Wins:</strong> <span id="statWins">0</span></div>
                            <div><strong>Losses:</strong> <span id="statLosses">0</span></div>
                            <div><strong>Win Rate:</strong> <span id="statWinRate">0%</span></div>
                            <div><strong>P/L:</strong> <span id="statPL">0.00</span></div>
                            <div><strong>Max DD:</strong> <span id="statDD">0.00</span></div>
                         
                        </section>
                
                                                                                                                                            
<section class="history">
 
  <h3 class="collapsible ">Bias Probability</h3> 
  <div class="collapsible-body">
    <div class="bias-row">
      <span>ODD</span>
      <div class="bar">
        <div id="oddBar" class="bar-fill odd"></div>
      </div>
      <span id="oddPct">0%</span>
    </div>

    <div class="bias-row">
      <span>EVEN</span>
      <div class="bar">
        <div id="evenBar" class="bar-fill even"></div>
      </div>
      <span id="evenPct">0%</span>
    </div>
  </div>
</section>


<section class="history">
<h3 class="collapsible">Trade History</h3>

<div class="collapsible-body">
<ul id="tradeHistory"></ul>
</div>
</section>


</div>
  </div>
</main>

  <!-- Your refactored script -->
  <script src="script.js"></script>

  <!-- Optional: environment label sync (only needed if not handled in script.js) -->
  <script>
    (function () {
      const liveToggle = document.getElementById('liveToggle');
      const envLabel = document.getElementById('environmentLabel');
      if (liveToggle && envLabel) {
        const updateLabel = () => {
          envLabel.textContent = liveToggle.checked ? 'Environment: LIVE' : 'Environment: DEMO';
        };
        liveToggle.addEventListener('change', updateLabel);
        updateLabel();
      }
    })();
    
    
  </script>
</body>
</html>
